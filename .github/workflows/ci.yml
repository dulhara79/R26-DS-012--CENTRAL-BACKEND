name: Central Backend Boundary CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  central-backend:
    runs-on: ubuntu-latest
    env:
      MRN_PEPPER: ci-only-not-for-production
      DATABASE_URL: sqlite:///./ci-central-backend.db
      FUSION_URL: https://fusion.invalid
      FUSION_API_TOKEN: ci-fake-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Central Backend dependencies
        run: pip install -r central_backend/requirements.txt

      - name: Verify Central-Backend-only layout
        run: |
          test -f central_backend/main.py
          test -f central_backend/db_models.py
          test -f central_backend/gate.py
          test -f central_backend/fusion_client.py
          test ! -d fusion_service
          ! grep -R -nE '^[[:space:]]*(from[[:space:]]+(fusion|harmonise)[[:space:]]|import[[:space:]]+(fusion|harmonise)([[:space:]]|$))' central_backend --include='*.py'
          ! grep -R -n "FUSION_SERVICE_DIR" central_backend --include='*.py'
          ! grep -n "BACKEND_API_TOKEN" central_backend/main.py
          ! grep -n "BACKEND_API_TOKEN" central_backend/env.example.txt

      - name: Run Central Backend validation with deterministic service stubs
        working-directory: central_backend
        run: python test_backend.py

      - name: Validate frozen Phase 0 contracts
        working-directory: central_backend
        run: python test_phase0_contracts.py

      - name: Validate Phase 1 authentication and assignments
        working-directory: central_backend
        run: python test_phase1_auth.py

      - name: Import application
        working-directory: central_backend
        run: python -c "from main import app; print(app.title)"

      - name: Record pinned source provenance
        run: |
          echo "component4final commit: a1ceef8daba268dac24d81aedd76c89e7c9ccc6a"
          echo "source central_backend tree: 87585bb3c823b9de449c1a0be1efd9d65f815fd2"
          echo "Fusion is an external dependency and is not vendored in this repository."
